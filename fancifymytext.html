<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fancify My Text</title>
  <script src="fancifymytext.js" defer></script>
</head>
<body>
  <h1>Fancify My Text</h1>

  <fieldset>
    <legend>Text</legend>
    <textarea id="textInput" rows="4" cols="30"></textarea>
  </fieldset>

  <fieldset>
    <legend>Fancify</legend>
    <button type="button" onclick="makeBigger()">Bigger!</button>
    <br>
    <label>
      <input type="radio" id="fancy" name="textStyle" onchange="changeStyle()">
      FancyShmancy
    </label>
    <br>
    <label>
      <input type="radio" id="boring" name="textStyle" onchange="changeStyle()" checked>
      BoringBetty
    </label>
    <br>
    <button type="button" onclick="mooText()">Moo</button>
  </fieldset>
</body>
</html>
